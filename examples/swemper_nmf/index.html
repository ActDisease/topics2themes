<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SweMPer · visualiseringar</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; font: 13px system-ui, sans-serif; color: #253746; background: #f2f5f8; }
header { padding: 10px 14px; background: white; border-bottom: 1px solid #b9c7d1; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
h1 { margin: 0; font-size: 16px; }
label { display: flex; align-items: center; gap: 7px; }
select { max-width: min(610px, 70vw); padding: 5px 7px; }
button, select, a { font: inherit; }
button { padding: 5px 9px; cursor: pointer; }
a { color: #176eae; }
:focus-visible { outline: 2px solid #176eae; outline-offset: 2px; }
#description { margin: 8px 0 5px; color: #43596a; line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 11px; color: #5f7483; }
#frame-host { flex: 1 1 auto; min-height: 0; background: white; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
#share-fallback { width: 100%; margin-top: 7px; padding: 5px; }
#share-fallback[hidden] { display: none; }
#status { margin-left: auto; font-size: 11px; }
@media (max-width: 700px) { select { max-width: 75vw; } #status { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="controls">
    <h1>SweMPer · visualiseringar</h1>
    <label for="version">Version <select id="version" aria-label="Välj visualisering"></select></label>
    <a id="standalone" target="_blank" rel="noopener">Öppna separat ↗</a>
    <button id="share" type="button">Kopiera länk</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <p id="description"></p>
  <div class="meta"><span id="size"></span><span>Endast vald vy laddas. Övriga filer läses först när du byter version.</span><span>Äldre vyer: öppna separat för att kopiera deras egen filterlänk.</span></div>
  <input id="share-fallback" readonly hidden aria-label="Delningslänk att kopiera">
</header>
<main id="frame-host" aria-label="Vald visualisering"></main>
<script>
'use strict';
const REGISTRY = {"default": "lakartidningen-swedish50", "versions": [{"id": "diabetes-swedish30", "group": "SweMPer · NMF", "label": "Diabetes · Swedish stopwords, 30 requested topics", "description": "Saved Swedish30 exploration: 26 retained topics; 2,490 exported top pages from 8,834 nonblank pages.", "path": "diabetes.html", "bytes": 543486}, {"id": "lakartidningen-swedish50", "group": "SweMPer · NMF", "label": "Svenska Läkartidningen · Swedish stopwords, 50 requested topics", "description": "Saved Swedish50 exploration: 39 retained topics; 5,764 exported top pages from 211,425 nonblank pages.", "path": "lakartidningen.html", "bytes": 1340117}]};
const $ = id => document.getElementById(id);
const versions = new Map(REGISTRY.versions.map(view => [view.id, view]));
const savedStates = new Map();
const allowedState = new Set(['from', 'to', 'zoom', 'groups', 'topics', 'only', 'hide']);
let currentId = null, frame = null, navigation = 0;
function cleanState(value) {
  if (typeof value !== 'string' || value.length > 20000) return '';
  const clean = new URLSearchParams();
  for (const [key, field] of new URLSearchParams(value)) if (allowedState.has(key)) clean.set(key, field);
  return clean.toString();
}
function childURL(view) {
  const url = new URL(view.path, window.location.href);
  url.search = savedStates.get(view.id) || '';
  url.hash = '';
  return url;
}
function updateLinks() {
  const view = versions.get(currentId);
  const url = new URL(window.location.href);
  url.search = ''; url.hash = '';
  url.searchParams.set('view', currentId);
  const state = savedStates.get(currentId);
  if (state) url.searchParams.set('state', state);
  try { window.history.replaceState(null, '', url); } catch (error) { console.warn('Could not update selector URL', error); }
  $('standalone').href = childURL(view).href;
  $('share-fallback').value = url.href;
}
function showVersion(id) {
  if (!versions.has(id)) id = REGISTRY.default;
  if (id === currentId) return;
  currentId = id;
  const view = versions.get(id);
  $('version').value = id;
  $('description').textContent = view.description;
  $('size').textContent = `Vald HTML-fil: ${(view.bytes / 1048576).toFixed(2)} MiB`;
  $('status').textContent = 'Laddar vald vy…';
  $('share-fallback').hidden = true;
  const serial = ++navigation;
  const next = document.createElement('iframe');
  next.title = `${view.group} — ${view.label}`;
  next.addEventListener('load', () => { if (serial === navigation) $('status').textContent = 'Vald vy laddad'; });
  frame = next;
  // Replacing, not hiding, releases the old browsing context on every switch.
  $('frame-host').replaceChildren(next);
  updateLinks();
  next.src = childURL(view).href;
}
const groups = new Map();
for (const view of REGISTRY.versions) {
  if (!groups.has(view.group)) { const group = document.createElement('optgroup'); group.label = view.group; groups.set(view.group, group); $('version').append(group); }
  const option = document.createElement('option'); option.value = view.id; option.textContent = view.label;
  groups.get(view.group).append(option);
}
window.addEventListener('message', event => {
  if (!frame || event.source !== frame.contentWindow || !event.data || event.data.type !== 'swemper-view-state') return;
  savedStates.set(currentId, cleanState(event.data.search));
  updateLinks();
});
$('version').addEventListener('change', event => showVersion(event.target.value));
$('share').addEventListener('click', async () => {
  updateLinks();
  try { await navigator.clipboard.writeText($('share-fallback').value); $('status').textContent = 'Länken kopierad'; }
  catch (error) { $('share-fallback').hidden = false; $('share-fallback').select(); $('status').textContent = 'Kopiera den markerade länken'; }
});
const initial = new URLSearchParams(window.location.search);
const initialId = versions.has(initial.get('view')) ? initial.get('view') : REGISTRY.default;
savedStates.set(initialId, cleanState(initial.get('state') || ''));
showVersion(initialId);
</script>
</body>
</html>
